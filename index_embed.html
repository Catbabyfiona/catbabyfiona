<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>星愿花园 · 三消养成小游戏</title>
<style>
/* ===== 基础与变量 ===== */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --cream:#FFF7EF; --pink:#FFD3E0; --pink-deep:#FF8FAB; --purple:#C9B6F0;
  --mint:#D9F3EA; --gold:#FFD166; --ink:#6B4F6B; --ink-soft:#A98BA8;
  --card:#FFFFFF; --shadow:0 6px 18px rgba(255,143,171,.25);
  --r:18px;
}
html,body{height:100%;}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Heiti SC",sans-serif;
  background:linear-gradient(160deg,#FFF0F5 0%,#F3E8FF 55%,#E0F7F4 100%);
  color:var(--ink); overflow:hidden; touch-action:manipulation; user-select:none; -webkit-user-select:none;
}
.app{
  position:relative; max-width:430px; height:100dvh; margin:0 auto; overflow:hidden;
  background:linear-gradient(170deg,#FFE3EC 0%,#F3E8FF 60%,#DFF5F0 100%);
  box-shadow:0 0 40px rgba(180,140,200,.35);
}
.view{position:absolute; inset:0; display:none; flex-direction:column; overflow-y:auto; overflow-x:hidden;}
.view.active{display:flex; animation:viewIn .28s ease;}
@keyframes viewIn{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:none;}}
::-webkit-scrollbar{width:0;height:0;}

/* ===== 通用组件 ===== */
.topbar{display:flex; align-items:center; gap:8px; padding:12px 14px; flex:none;}
.back{width:44px;height:44px;border-radius:50%;background:#fff;border:none;box-shadow:var(--shadow);
  font-size:27px;line-height:1;color:#B96AA8;cursor:pointer;flex:none;font-weight:800;
  display:inline-flex;align-items:center;justify-content:center;padding-bottom:3px;}
.topbar h2{flex:1; font-size:19px; text-align:center; letter-spacing:1px;}
.topbar .res{display:flex; gap:8px; flex:none;}
.pill{display:flex; align-items:center; gap:4px; background:#fff; border-radius:999px; padding:6px 12px;
  box-shadow:var(--shadow); font-size:14px; font-weight:700;}
.pill .ico{font-size:15px;}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:none; cursor:pointer;
  font-family:inherit; font-weight:800; color:#fff; letter-spacing:1px;
  background:linear-gradient(135deg,#FF9FBC,#FF7FA5); border-radius:999px;
  padding:14px 26px; font-size:17px; box-shadow:0 8px 20px rgba(255,127,165,.4);
  transition:transform .12s ease, box-shadow .12s ease;}
.btn:active{transform:scale(.94);}
.btn.gold{background:linear-gradient(135deg,#FFD97A,#FFB84D); box-shadow:0 8px 20px rgba(255,184,77,.4); color:#7A4E00;}
.btn.purple{background:linear-gradient(135deg,#C9B6F0,#A98BE0); box-shadow:0 8px 20px rgba(169,139,224,.4);}
.btn.mini{padding:9px 16px; font-size:14px; box-shadow:0 4px 12px rgba(255,127,165,.3);}
.btn.ghost{background:#fff; color:var(--pink-deep); box-shadow:var(--shadow);}
.btn:disabled{opacity:.45; filter:grayscale(.4);}

.home-wrap{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; padding:0 26px 40px; text-align:center;}
.logo{font-size:44px; font-weight:900; color:#fff; letter-spacing:4px; text-shadow:0 4px 0 rgba(255,143,171,.45),0 10px 26px rgba(255,127,165,.5);}
.logo-sub{font-size:14px; color:#fff; letter-spacing:2px; margin-top:8px; text-shadow:0 2px 8px rgba(200,120,160,.6);}
.home-hud{display:flex; gap:10px; margin:22px 0 18px;}
.home-actions{display:flex; flex-direction:column; gap:14px; width:100%; max-width:300px;}
.home-actions .btn{width:100%;}
.home-foot{margin-top:18px; font-size:12px; color:rgba(255,255,255,.9); text-shadow:0 1px 6px rgba(180,100,140,.8);}

/* ===== 关卡地图 ===== */
.map-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; padding:6px 16px 26px;}
.map-sec{margin:10px 0 8px; padding:14px 0 4px; border-top:2px dashed rgba(255,255,255,.65);}
.map-sec-title{display:flex; align-items:center; justify-content:center; gap:8px; font-size:17px; font-weight:900; color:#4E7A4E; letter-spacing:2px;}
.map-sec-sub{text-align:center; font-size:12px; font-weight:700; color:#8FA98F; margin:4px 0 10px;}
.map-sec.locked-sec{opacity:.85;}
.map-sec.locked-sec .map-sec-sub{color:#B9A8B9;}
.sec-dots{display:inline-flex; gap:4px; vertical-align:middle; margin-left:4px;}
.sec-dots .dot{width:9px; height:9px; border-radius:50%; background:#E5D8E5; display:inline-block;}
.sec-dots .dot.on{background:#7EC9A5; box-shadow:0 0 6px rgba(126,201,165,.8);}
.lv-card{position:relative; aspect-ratio:1; border-radius:var(--r); background:#fff; box-shadow:var(--shadow);
  display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer;
  transition:transform .12s ease; border:2px solid transparent;}
.lv-card:active{transform:scale(.94);}
.lv-card .num{font-size:22px; font-weight:900; color:var(--pink-deep);}
.lv-card .stars{font-size:12px; color:var(--gold); letter-spacing:1px; margin-top:4px;}
.lv-card .lbl{font-size:10px; color:var(--ink-soft); margin-top:2px;}
.lv-card.locked{background:rgba(255,255,255,.55); border-color:transparent; cursor:default;}
.lv-card.locked .lock{font-size:22px; opacity:.6;}
.lv-card.locked .need{font-size:10px; color:var(--ink-soft); margin-top:4px;}
.lv-card.cleared{background:linear-gradient(135deg,#fff,#FFF3D6);}
.lv-card.current{border-color:var(--gold); box-shadow:0 0 0 3px rgba(255,209,102,.4),var(--shadow);}

#view-game.forest .hud-chip{background:rgba(255,255,255,.92);}
#view-game.forest .goal-line{color:#3E6B3E;}
.game-top{padding:10px 14px 4px;}
.hud-row{display:flex; align-items:center; justify-content:space-between; gap:6px;}
.hud-chip{flex:1; background:#fff; border-radius:14px; padding:7px 8px; box-shadow:var(--shadow);
  display:flex; flex-direction:column; align-items:center; gap:1px;}
.hud-chip .k{font-size:10px; color:var(--ink-soft);}
.hud-chip .v{font-size:16px; font-weight:900; color:var(--ink);}
.hud-chip .v small{font-size:10px; font-weight:700; color:var(--ink-soft);}
.goalbar{background:#fff; border-radius:999px; height:14px; margin:10px 4px 0; box-shadow:var(--shadow); overflow:hidden;}
.goalbar .fill{height:100%; width:0%; border-radius:999px;
  background:linear-gradient(90deg,#FFD97A,#FF9FBC); transition:width .35s ease;}
.goal-line{display:flex; justify-content:space-between; font-size:11px; color:var(--ink-soft); padding:4px 8px 0;}
.board-shell{flex:1; display:flex; align-items:center; justify-content:center; padding:8px 14px 4px; min-height:0;}
.board{position:relative; display:grid; grid-template-columns:repeat(8,1fr); gap:5px;
  width:100%; max-width:396px; aspect-ratio:1; padding:9px;
  background:rgba(255,255,255,.62); border-radius:24px; box-shadow:var(--shadow);}
.cell{position:relative; border-radius:14px; overflow:hidden; cursor:pointer;
  transition:transform .12s ease, box-shadow .12s ease; background:#fff;}
.cell img{width:100%; height:100%; object-fit:cover; display:block; pointer-events:none;}
.cell.selected{outline:3px solid var(--gold); outline-offset:-2px; transform:scale(1.08); z-index:2;}
.cell.hint{outline:2px dashed #FF9F1C; outline-offset:-2px; animation:hintPulse 1s ease-in-out infinite;}
@keyframes hintPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,159,28,.55);} 50%{box-shadow:0 0 0 7px rgba(255,159,28,0);}}
.cell.popping{animation:pop .32s ease forwards;}
@keyframes pop{0%{transform:scale(1); opacity:1;} 60%{transform:scale(1.18);} 100%{transform:scale(.2); opacity:0;}}
.cell.falling{animation:fall .22s ease;}
@keyframes fall{from{transform:translateY(-110%); opacity:0;} to{transform:none; opacity:1;}}
.cell.special-stripe img{animation:spin 6s linear infinite;}
.cell.special-rainbow img{animation:rainbowSpin 5s linear infinite; filter:saturate(1.25) brightness(1.06);}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes rainbowSpin{0%{transform:rotate(0) scale(1);}50%{transform:rotate(180deg) scale(1.08);}100%{transform:rotate(360deg) scale(1);}}
.game-foot{flex:none; display:flex; align-items:center; justify-content:space-around; padding:8px 16px 14px; gap:10px;}
.combo-float{position:absolute; left:50%; top:42%; transform:translate(-50%,-50%); pointer-events:none;
  font-size:30px; font-weight:900; color:var(--pink-deep); text-shadow:0 3px 0 #fff; letter-spacing:2px;
  opacity:0; z-index:9; white-space:nowrap;}
.combo-float.show{animation:comboUp .8s ease;}
@keyframes comboUp{0%{opacity:0; transform:translate(-50%,-50%) scale(.5);} 25%{opacity:1; transform:translate(-50%,-58%) scale(1.15);} 100%{opacity:0; transform:translate(-50%,-120%) scale(1);}}
.toast{position:absolute; left:50%; top:16%; transform:translateX(-50%); z-index:20; pointer-events:none;
  background:rgba(107,79,107,.9); color:#fff; padding:8px 18px; border-radius:999px; font-size:13px;
  opacity:0; transition:opacity .3s ease; white-space:nowrap;}
.toast.show{opacity:1;}
.score-pop{position:absolute; pointer-events:none; font-weight:900; color:var(--pink-deep);
  text-shadow:0 2px 0 #fff; z-index:8; font-size:18px; animation:scoreFloat .8s ease forwards;}
@keyframes scoreFloat{from{opacity:1; transform:translateY(0);} to{opacity:0; transform:translateY(-46px);}}

/* ===== 花园 ===== */
#view-garden{background:linear-gradient(180deg,#E6F9F1 0%,#FFF3E0 100%);}
.garden-top{display:flex; align-items:center; gap:8px; padding:12px 14px; flex:none;}
.flower-dex-bar{margin:0 16px 8px; padding:9px 14px; border-radius:999px; background:rgba(255,255,255,.88); box-shadow:var(--shadow);
  font-size:12px; font-weight:800; color:#8A5A44; text-align:center; line-height:1.5;}
.pet-corner{margin:10px 16px 16px; padding:12px; border-radius:20px; background:rgba(255,255,255,.9); box-shadow:var(--shadow);
  display:flex; align-items:center; justify-content:center; gap:14px;}
.pet-corner img{width:56px; height:56px; object-fit:contain; border-radius:14px; animation:petBounce 2s ease-in-out infinite;}
.pet-corner img:nth-child(2){animation-delay:.3s;}
.pet-corner img:nth-child(3){animation-delay:.6s;}
.pet-corner .pet-msg{font-size:12px; font-weight:800; color:#8A5A44; flex:1; text-align:center; line-height:1.5;}
@keyframes petBounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
.garden-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px; padding:8px 16px 20px;}
.plot{aspect-ratio:1; border-radius:20px; background:#fff; box-shadow:var(--shadow); border:2px dashed #FFC9DA;
  display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; position:relative; overflow:hidden; padding:8px;}
.plot img{width:78%; height:78%; object-fit:contain; border-radius:16px;}
.plot.growing img{width:62%; height:62%; margin-top:14px;}
.plot .grow-bar{position:absolute; left:12%; right:12%; bottom:6px; height:7px; border-radius:999px; background:#F3E8FF; overflow:hidden;}
.plot .grow-bar .f{height:100%; width:0%; background:linear-gradient(90deg,#B9F3D9,#7EE0B0); border-radius:999px; transition:width 1s linear;}
.plot .p-name{font-size:13px; font-weight:800; color:var(--ink); z-index:1;}
.plot.growing .p-name{margin-bottom:15px; font-size:12px;}
.plot .p-hint{font-size:10px; color:var(--ink-soft);}
.plot.locked{border-style:solid; border-color:#E9DFF5; background:rgba(255,255,255,.6);}
.plot.locked .lock{font-size:26px;}
.plot.ready{border-color:#7EE0B0; box-shadow:0 0 0 4px rgba(126,224,176,.3),var(--shadow); animation:readyPulse 1.6s ease infinite;}
@keyframes readyPulse{50%{box-shadow:0 0 0 7px rgba(126,224,176,.18),var(--shadow);}}
.seed-shop{position:fixed; left:0; right:0; bottom:0; background:rgba(255,255,255,.97); border-radius:24px 24px 0 0;
  padding:16px; box-shadow:0 -10px 30px rgba(0,0,0,.12); transform:translateY(110%); transition:transform .3s ease; z-index:15; max-height:70%; overflow-y:auto;}
.seed-shop.open{transform:none;}
.seed-shop h3{text-align:center; margin-bottom:12px; font-size:17px;}
.seed-list{display:flex; flex-direction:column; gap:10px;}
.seed-item{display:flex; align-items:center; gap:12px; background:#FFF7EF; border-radius:16px; padding:10px;}
.seed-item img{width:56px;height:56px;border-radius:12px; object-fit:cover;}
.seed-item .s-name{font-weight:800; font-size:15px;}
.seed-item .s-desc{font-size:11px; color:var(--ink-soft); margin-top:2px;}
.seed-item .s-btn{margin-left:auto;}
.overlay{position:fixed; inset:0; background:rgba(107,79,107,.35); z-index:14; opacity:0; pointer-events:none; transition:opacity .3s ease;}
.overlay.show{opacity:1; pointer-events:auto;}

/* ===== 图鉴 ===== */
.dex-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; padding:8px 16px 20px;}
.dex-card{border-radius:var(--r); background:#fff; box-shadow:var(--shadow); padding:14px 8px;
  display:flex; flex-direction:column; align-items:center; gap:6px;}
.dex-card img{width:86%; aspect-ratio:1; object-fit:cover; border-radius:16px;}
.dex-card .d-name{font-weight:800; font-size:14px;}
.dex-card .d-how{font-size:10px; color:var(--ink-soft); text-align:center; line-height:1.5;}
.dex-card.locked img{filter:grayscale(1) brightness(.92); opacity:.55;}
.dex-progress{margin:4px 16px 12px; background:#fff; border-radius:999px; height:14px; box-shadow:var(--shadow); overflow:hidden;}
.dex-progress .f{height:100%; background:linear-gradient(90deg,#C9B6F0,#FF9FBC); border-radius:999px; transition:width .4s ease;}
.dex-tip{margin:4px 16px 2px; padding:9px 14px; border-radius:999px; background:rgba(255,255,255,.88); box-shadow:var(--shadow);
  font-size:12px; font-weight:800; color:#8A5A44; text-align:center; line-height:1.5;}

/* ===== 结算弹窗 ===== */
.modal-mask{position:absolute; inset:0; background:rgba(107,79,107,.45); z-index:30; display:none; align-items:center; justify-content:center; padding:26px;}
.modal-mask.show{display:flex;}
.modal{width:100%; max-width:340px; background:linear-gradient(180deg,#FFF7EF,#FFEAF3); border-radius:26px;
  padding:26px 22px 22px; text-align:center; box-shadow:0 18px 50px rgba(107,79,107,.35);
  animation:modalIn .35s cubic-bezier(.34,1.56,.64,1);}
@keyframes modalIn{from{transform:scale(.7); opacity:0;} to{transform:none; opacity:1;}}
.modal h3{font-size:24px; letter-spacing:2px; margin-bottom:6px;}
.modal .m-sub{font-size:13px; color:var(--ink-soft); margin-bottom:12px;}
.star-row{display:flex; justify-content:center; gap:10px; margin:12px 0;}
.star{font-size:44px; color:#E4D8EF; transform:scale(.4); opacity:0;}
.star.on{color:var(--gold); animation:starIn .5s cubic-bezier(.34,1.56,.64,1) forwards; text-shadow:0 4px 14px rgba(255,209,102,.6);}
@keyframes starIn{from{transform:scale(.4) rotate(-30deg); opacity:0;} to{transform:scale(1); opacity:1;}}
.reward-line{display:flex; justify-content:space-between; background:#fff; border-radius:14px; padding:10px 16px; margin:8px 0; font-size:14px; box-shadow:var(--shadow);}
.reward-line b{color:var(--pink-deep);}
.modal .m-actions{display:flex; gap:10px; margin-top:16px;}
.modal .m-actions .btn{flex:1; padding:12px 8px; font-size:15px;}

/* ===== 教学 ===== */
.tut{position:absolute; inset:0; z-index:40; background:rgba(107,79,107,.5); display:none; align-items:center; justify-content:center; padding:30px;}
.tut.show{display:flex;}
.tut-card{background:#fff; border-radius:24px; padding:24px 20px; text-align:center; max-width:300px; animation:modalIn .35s ease;}
.tut-card .t-img{width:120px;height:120px;border-radius:20px; object-fit:cover; margin:0 auto 12px;}
.tut-card p{font-size:15px; line-height:1.7; color:var(--ink);}

/* ===== 调试面板 ===== */
#debug{position:absolute; right:10px; bottom:66px; z-index:50; font-size:11px;}
#debug .dbg-btn{width:36px;height:36px;border-radius:50%; border:none; background:rgba(107,79,107,.75); color:#fff; cursor:pointer; font-weight:900;}
#debug .dbg-panel{display:none; margin-top:8px; background:rgba(255,255,255,.96); border-radius:14px; padding:10px 12px;
  width:210px; box-shadow:0 10px 30px rgba(0,0,0,.18);}
#debug.open .dbg-panel{display:block;}
#debug .dbg-row{display:flex; justify-content:space-between; gap:6px; margin:5px 0;}
#debug button{font-size:11px; padding:4px 8px; border-radius:8px; border:none; background:#F3E8FF; color:var(--ink); cursor:pointer;}
#debug .rid{color:var(--ink-soft); word-break:break-all; line-height:1.4;}
@media (max-height:700px){
  .logo{font-size:36px;}
  .home-wrap{padding-bottom:22px;}
  .home-actions{gap:10px;}
  .cell{border-radius:10px;}
  .board{gap:4px; padding:7px; border-radius:18px;}
}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- ===== 视图：主菜单 ===== -->
  <section class="view active" id="view-home">
    <div class="home-wrap">
      <div class="logo"><svg viewBox="0 0 24 24" width="34" height="34" fill="#FFE9A8" style="vertical-align:-6px;margin-right:4px;"><path d="M12 2l2.2 6.1 6.5.5-5 4.2 1.5 6.3L12 15.7l-5.2 3.4 1.5-6.3-5-4.2 6.5-.5z"/></svg>星愿花园</div>
      <div class="logo-sub">三消解谜 · 养成你的甜品花园</div>
      <div class="home-hud">
        <div class="pill"><svg class="ico" viewBox="0 0 24 24" width="16" height="16" fill="#FFB84D"><path d="M12 2.5l2.8 6 6.7.7-5 4.5 1.4 6.6L12 17.1l-5.9 3.2 1.4-6.6-5-4.5 6.7-.7z"/></svg><span id="home-stars">0</span></div>
        <div class="pill"><svg class="ico" viewBox="0 0 24 24" width="16" height="16" fill="#FF8FAB"><path d="M12 6c-4 0-6.5 2.3-6.5 6s2.5 6 6.5 6 6.5-2.3 6.5-6-2.5-6-6.5-6z"/><path d="M5.6 10.2L2.6 9l-.4 1.8 3 1.4zM18.4 13.8l3 1.4.4-1.8-3-1.4z"/></svg><span id="home-coins">0</span></div>
      </div>
      <div class="home-actions">
        <button class="btn" id="btn-play">开始游戏</button>
        <button class="btn gold" id="btn-garden">我的花园</button>
        <button class="btn purple" id="btn-dex">动物图鉴</button>

      <div class="home-foot">收集星星 · 解锁章节 · 收获花朵</div>
    </div>
  </section>

  <!-- ===== 视图：关卡地图 ===== -->
  <section class="view" id="view-map">
    <div class="topbar">
      <button class="back" data-go="home">‹</button>
      <h2>关卡地图</h2>
      <div class="res">
        <div class="pill"><svg class="ico" viewBox="0 0 24 24" width="16" height="16" fill="#FFB84D"><path d="M12 2.5l2.8 6 6.7.7-5 4.5 1.4 6.6L12 17.1l-5.9 3.2 1.4-6.6-5-4.5 6.7-.7z"/></svg><span id="map-stars">0</span></div>
        <div class="pill"><svg class="ico" viewBox="0 0 24 24" width="16" height="16" fill="#FF8FAB"><path d="M12 6c-4 0-6.5 2.3-6.5 6s2.5 6 6.5 6 6.5-2.3 6.5-6-2.5-6-6.5-6z"/><path d="M5.6 10.2L2.6 9l-.4 1.8 3 1.4zM18.4 13.8l3 1.4.4-1.8-3-1.4z"/></svg><span id="map-coins">0</span></div>
      </div>
    </div>
    <div class="map-grid" id="map-grid"></div>
    <div class="map-sec" id="map-section-forest">
      <div class="map-sec-title"><svg class="ico" viewBox="0 0 24 24" width="18" height="18" fill="#6FA96F"><path d="M12 2c2.5 3 4 5.5 4 8a4 4 0 0 1-8 0c0-2.5 1.5-5 4-8zM5 20c0-3 3-5 7-5s7 2 7 5v1H5v-1z"/></svg>小动物森林<svg class="ico" viewBox="0 0 24 24" width="18" height="18" fill="#6FA96F"><path d="M12 2c2.5 3 4 5.5 4 8a4 4 0 0 1-8 0c0-2.5 1.5-5 4-8zM5 20c0-3 3-5 7-5s7 2 7 5v1H5v-1z"/></svg></div>
      <div class="map-sec-sub" id="map-sec-sub">集齐动物图鉴解锁森林</div>
      <div class="map-grid" id="map-grid-forest"></div>
    </div>
  </section>

  <!-- ===== 视图：游戏 ===== -->
  <section class="view" id="view-game">
    <div class="game-top">
      <div class="hud-row">
        <button class="back" data-go="map">‹</button>
        <div class="hud-chip"><span class="k">第 <b id="hud-level">1</b> 关</span><span class="v" id="hud-target">0</span></div>
        <div class="hud-chip"><span class="k">剩余步数</span><span class="v" id="hud-steps">20</span></div>

      </div>

      <div class="goal-line"><span id="goal-label">目标分数</span><span id="goal-cur">0 / 600</span></div>
    </div>

      <div class="board" id="board"></div>
      <div class="combo-float" id="combo-float"></div>
    </div>
    <div class="game-foot">
      <button class="btn mini gold" id="btn-win-now" style="display:none;">过关</button>
      <button class="btn mini ghost" id="btn-shuffle">重排</button>
      <button class="btn mini ghost" id="btn-restart">重开</button>
      <button class="btn mini ghost" id="btn-mute">声音：开</button>
    </div>

    </div>

    <div class="garden-grid" id="garden-grid"></div>
    <div class="pet-corner" id="pet-corner" style="display:none;"></div>
  </section>
  <div class="overlay" id="garden-overlay"></div>
  <div class="seed-shop" id="seed-shop">
    <h3>选择一颗种子</h3>
    <div class="seed-list" id="seed-list"></div>
  </div>

  <!-- ===== 视图：图鉴 ===== -->
  <section class="view" id="view-dex">
    <div class="topbar">
      <button class="back" data-go="home">‹</button>
      <h2>动物图鉴</h2>
      <div class="res"><div class="pill">图鉴<span id="dex-count">0/3</span></div></div>
    </div>
    <div class="dex-tip" id="dex-tip">集齐 3 只小动物，奖励 5 星</div>
    <div class="dex-progress"><div class="f" id="dex-fill"></div></div>
    <div class="dex-grid" id="dex-grid"></div>
  </section>

  <!-- ===== 结算弹窗 ===== -->
  <div class="modal-mask" id="result-mask">
    <div class="modal">
      <h3 id="result-title">过关啦！</h3>
      <div class="m-sub" id="result-sub">太棒了，花园又前进一步</div>
      <div class="star-row" id="star-row"><span class="star">★</span><span class="star">★</span><span class="star">★</span></div>
      <div class="reward-line"><span>通关奖励</span><b id="reward-win">金币 +0</b></div>
      <div class="reward-line"><span>剩余步数奖励</span><b id="reward-step">金币 +0</b></div>
      <div class="m-actions">
        <button class="btn ghost" id="btn-result-back">返回</button>
        <button class="btn" id="btn-result-next">下一关</button>
      </div>
    </div>
  </div>

const Save = {
  KEY: 'starwish-garden-save-v1',
  data: null,
  def(){ return {
    stars:0, coins:CONFIG.startCoins, unlocked:1, best:{},
    garden: Array.from({length:CONFIG.plots.length},(_,i)=>({seed:null,plantedAt:0,owned: i===0})),
    dex:{}, flowerDex:{}, flowerDexDone:false, dexDone:false, muted:false, tutorialDone:false, wins:0
  }; },
  load(){
    try{ const raw = localStorage.getItem(this.KEY);
      this.data = raw ? Object.assign(this.def(), JSON.parse(raw)) : this.def();
      if(!Array.isArray(this.data.garden) || this.data.garden.length!==CONFIG.plots.length)
        this.data.garden = this.def().garden;
      this.data.garden = this.data.garden.map((p,i)=>Object.assign({seed:null,plantedAt:0,owned: i===0}, p));
    }catch(e){ this.data = this.def(); }
    return this.data;
  },
  save(){ try{ localStorage.setItem(this.KEY, JSON.stringify(this.data)); }catch(e){} },
  reset(){ try{ localStorage.removeItem(this.KEY); }catch(e){} this.data = this.def(); }
};

/* ---------------- 关卡 ---------------- */
function genLevels(){
  const ls = [];
  for(let n=1; n<=25; n++){
    const raw = CONFIG.levelBase * Math.pow(CONFIG.levelGrowth, n-1);
    const target = Math.round(raw / CONFIG.levelRound) * CONFIG.levelRound;
    const star2 = Math.round(target * CONFIG.starMult[1]);
    const star3 = Math.round(target * CONFIG.starMult[2]);
    let type = 'score', collect = null;
    if(n>=11 && n%2===0){ type='collect'; collect={t:'strawberry', n: Math.min(24, 10 + Math.floor((n-11)/2)*2)}; }
    else if(n===13 || n===16 || n===19){ type='both'; collect={t:'grape', n: 12 + Math.floor(n/4)}; }
    ls.push({ n, target, star2, star3,
      steps: n>=21 ? 24 : (n>=CONFIG.stepsFromLevel ? 22 : CONFIG.stepsBase),
      type, collect });
  }
  return ls;
}
const LEVELS = genLevels();

/* ---------------- 三消引擎 ---------------- */
const Engine = {
  board: null,          // board[r][c] = { t, s:null|'h'|'v'|'rainbow' }
  score: 0, moves: 0, combo: 0, collected: 0,
  level: null, busy: false, over: false,

  init(level){
    this.level = level; this.score = 0; this.moves = 0; this.combo = 0; this.collected = 0;
    this.over = false; this.busy = false; this.noMatchHints = 0;
    let guard = 0;
    do { this.board = this.randomBoard(); guard++; } while(this.findMatches().length>0 && guard<30);
  },
  randomBoard(){
    const b = [];
    for(let r=0;r<CONFIG.rows;r++){ const row=[];
      for(let c=0;c<CONFIG.cols;c++) row.push({ t: CONFIG.types[(Math.random()*CONFIG.types.length)|0], s:null });
      b.push(row);
    }
    return b;
  },
  at(r,c){ return (r>=0&&r<CONFIG.rows&&c>=0&&c<CONFIG.cols) ? this.board[r][c] : null; },

  /* 找出所有 >=3 的直线匹配，返回 [{cells, t, dir, len}] */
  findMatches(){
    const out = [], seen = new Set();
    // 行扫描
    for(let r=0;r<CONFIG.rows;r++){
      let c=0;
      while(c<CONFIG.cols){
        const t = this.board[r][c].t; let end=c+1;
        while(end<CONFIG.cols && this.board[r][end].t===t) end++;
        if(end-c>=3){ const cells=[];
          for(let k=c;k<end;k++) cells.push({r,c:k});
          out.push({cells,t,dir:'h',len:end-c});
        }
        c=end;
      }
    }
    // 列扫描
    for(let c=0;c<CONFIG.cols;c++){
      let r=0;
      while(r<CONFIG.rows){
        const t = this.board[r][c].t; let end=r+1;
        while(end<CONFIG.rows && this.board[end][c].t===t) end++;
        if(end-r>=3){ const cells=[];
          for(let k=r;k<end;k++) cells.push({r:k,c});
          out.push({cells,t,dir:'v',len:end-r});
        }
        r=end;
      }
    }
    return out;
  },

  /* 一次交换尝试：成功返回 true（并已交换） */
  swap(a,b){
    const ba=this.board[a.r][a.c], bb=this.board[b.r][b.c];
    this.board[a.r][a.c]=bb; this.board[b.r][b.c]=ba;
    if(this.findMatches().length>0) return true;
    this.board[a.r][a.c]=ba; this.board[b.r][b.c]=bb;
    return false;
  },

  /* 无副作用探测：交换两颗糖是否能形成匹配（探测后总是恢复原状） */
  wouldMatch(a,b){
    const ba=this.board[a.r][a.c], bb=this.board[b.r][b.c];
    this.board[a.r][a.c]=bb; this.board[b.r][b.c]=ba;
    const ok = this.findMatches().length>0;
    this.board[a.r][a.c]=ba; this.board[b.r][b.c]=bb;
    return ok;
  },

  /* 是否存在可执行的交换（只探测、不改变棋盘） */
  hasValidMove(){
    for(let r=0;r<CONFIG.rows;r++) for(let c=0;c<CONFIG.cols;c++){
      if(c+1<CONFIG.cols && this.wouldMatch({r,c},{r,c:c+1})) return true;
      if(r+1<CONFIG.rows && this.wouldMatch({r,c},{r:r+1,c})) return true;
    }
    return false;
  },

  /* 无可用移动时洗牌 */
  shuffle(){
    let guard=0;
    do{ this.board = this.randomBoard(); guard++; } while((this.findMatches().length>0 || !this.hasValidMove()) && guard<30);
  },

  /* 结算一轮消除：返回 { eliminate:Set<"r,c">, specials:[{r,c,s}], combo, pts, collectedN } */
  settleRound(){
    const matches = this.findMatches();
    if(matches.length===0) return null;
    this.combo++;
    const eliminate = new Set();
    const specials = [];          // 本回合新生成的特殊糖
    // 第一步：普通格子进消除集，>=4 连的中间格生成特殊（特殊格不消除，其余格消除）
    for(const m of matches){
      const mid = m.cells[(m.len/2)|0];
      const midKey = mid.r+','+mid.c;
      if(m.len>=5 || m.len===4){
        if(!eliminate.has(midKey)){
          specials.push({r:mid.r,c:mid.c,s: m.len>=5 ? 'rainbow' : (m.dir==='h'?'h':'v')});
          m.cells.forEach(p=>{ if(p.r!==mid.r || p.c!==mid.c) eliminate.add(p.r+','+p.c); });
        } else {
          m.cells.forEach(p=>eliminate.add(p.r+','+p.c));
        }
      } else {
        m.cells.forEach(p=>eliminate.add(p.r+','+p.c));
      }
    }
    // 第二步：把新生成的特殊糖从消除集中移除（若被卷入），并放入棋盘
    for(const sp of specials){
      eliminate.delete(sp.r+','+sp.c);
      this.board[sp.r][sp.c] = { t: this.board[sp.r][sp.c].t, s: sp.s };
    }
    // 第三步：特殊糖触发连锁扩展（条纹清行/列、彩虹清同色）
    const queue = [...eliminate];
    while(queue.length){
      const key = queue.pop();
      const [r,c] = key.split(',').map(Number);
      const b = this.board[r][c];
      if(!b) continue;
      if(b.s==='h'){ for(let cc=0;cc<CONFIG.cols;cc++){ const k=r+','+cc; if(!eliminate.has(k)){ eliminate.add(k); queue.push(k); } } }
      else if(b.s==='v'){ for(let rr=0;rr<CONFIG.rows;rr++){ const k=rr+','+c; if(!eliminate.has(k)){ eliminate.add(k); queue.push(k); } } }
      else if(b.s==='rainbow'){ for(let rr=0;rr<CONFIG.rows;rr++) for(let cc=0;cc<CONFIG.cols;cc++){
        if(this.board[rr][cc].t===b.t){ const k=rr+','+cc; if(!eliminate.has(k)){ eliminate.add(k); queue.push(k); } } } }
    }
    // 计分
    const mult = CONFIG.comboMult[Math.min(this.combo, CONFIG.comboMult.length)-1];
    const pts = eliminate.size * CONFIG.baseScore * mult;
    this.score += pts;
    let collectedN = 0;
    if(this.level.collect){
      for(const k of eliminate){ const [r,c]=k.split(',').map(Number);
        if(this.board[r][c].t===this.level.collect.t) collectedN++; }
    }
    this.collected += collectedN;
    return { eliminate, specials, combo:this.combo, pts, collectedN };
  },

  /* 重力下落 + 顶部填充，返回新填充的格子集合 */
  applyGravity(eliminate){
    const filled = new Set();
    for(let c=0;c<CONFIG.cols;c++){
      let write = CONFIG.rows-1;
      for(let r=CONFIG.rows-1; r>=0; r--){
        if(!eliminate.has(r+','+c)){ this.board[write][c]=this.board[r][c]; if(write!==r) this.board[r][c]=null; write--; }
      }
      for(let r=write; r>=0; r--){
        this.board[r][c] = { t: CONFIG.types[(Math.random()*CONFIG.types.length)|0], s:null };
        filled.add(r+','+c);
      }
    }
    return filled;
  }
};

/* ---------------- 音效（Web Audio 合成） ---------------- */
const Sfx = {
  ctx: null, muted: false,
  ensure(){ try{
    if(!this.ctx) this.ctx = new (window.AudioContext||window.webkitAudioContext)();
    if(this.ctx.state==='suspended') this.ctx.resume();
    Music.tryStart();
  }catch(e){} },
  tone(freq, dur, type, gain, delay){
    if(this.muted || !this.ctx) return;
    try{
      const t0 = this.ctx.currentTime + (delay||0);
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type||'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(gain||0.12, t0+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
      o.connect(g); g.connect(this.ctx.destination);
      o.start(t0); o.stop(t0+dur+0.05);
    }catch(e){}
  },
  swap(){ this.tone(320,0.09,'triangle',0.09); },
  swapback(){ this.tone(200,0.09,'triangle',0.06); },
  clear(combo){ this.tone(520+combo*70,0.1,'sine',0.12); this.tone(720+combo*70,0.12,'sine',0.1,0.05); },
  special(){ this.tone(880,0.12,'sine',0.14); this.tone(1320,0.14,'sine',0.12,0.06); },
  win(){ [523,659,784,1047].forEach((f,i)=>this.tone(f,0.22,'sine',0.13,i*0.12)); },
  lose(){ this.tone(330,0.16,'sine',0.1); this.tone(247,0.26,'sine',0.1,0.14); },
  click(){ this.tone(620,0.05,'triangle',0.08); },
  coin(){ this.tone(1250,0.06,'square',0.05); this.tone(1568,0.08,'square',0.04,0.05); },
  harvest(){ this.tone(784,0.1,'sine',0.12); this.tone(1047,0.12,'sine',0.12,0.08); this.tone(1319,0.16,'sine',0.1,0.16); },
  star(){ this.tone(988,0.18,'sine',0.12); this.tone(1319,0.22,'sine',0.1,0.1); }
};

};
</script>
<script id="js-app">
/* ============================================================
 * 星愿花园 · 应用层（渲染 / 输入 / 视图 / 结算 / 花园 / 图鉴）
 * ============================================================ */
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(res => setTimeout(res, ms));
let selected = null, currentPlot = -1, gardenTimer = null, hintPair = null;

/* ---------------- 视图路由 ---------------- */
function go(view){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  $('view-'+view).classList.add('active');
  currentView = view;
  if(view==='home') refreshHome();
  if(view==='map') renderMap();
  if(view==='garden') renderGarden();
  if(view==='dex') renderDex();
  document.querySelector('.app').scrollTop = 0;
}
document.querySelectorAll('[data-go]').forEach(b=>{
  b.addEventListener('click', ()=>{ Sfx.ensure(); Sfx.click(); go(b.dataset.go); });
});

function refreshHome(){
  $('home-stars').textContent = Save.data.stars;
  $('home-coins').textContent = Save.data.coins;
}

/* ---------------- 关卡地图 ---------------- */
function lvLabel(lv){
  if(!lv.collect) return '达标';
  return lv.type==='both' ? '收集+分数' : '收集';
}
function renderMap(){
  $('map-stars').textContent = Save.data.stars;
  $('map-coins').textContent = Save.data.coins;
  const grid = $('map-grid'); grid.innerHTML = '';
  const forestGrid = $('map-grid-forest'); if(forestGrid) forestGrid.innerHTML = '';
  const sec = $('map-section-forest');
  const forestUnlocked = !!Save.data.dexDone;
  if(sec){
    sec.classList.toggle('locked-sec', !forestUnlocked);
    const got = Object.keys(Save.data.dex).length;
    const dots = ['rabbit','cat','bear'].map(k => '<i class="dot' + (Save.data.dex[k] ? ' on' : '') + '"></i>').join('');
    $('map-sec-sub').innerHTML = forestUnlocked
      ? '集齐动物图鉴解锁！欢迎来到森林'
      : '集齐 3 只小动物解锁森林 · 已收集 ' + got + '/3 <span class="sec-dots">' + dots + '</span>';
  }
  LEVELS.forEach(lv=>{
    const isForest = lv.n >= 21;
    const parent = isForest ? forestGrid : grid;
    if(!parent) return;
    const need = CONFIG.unlockStars[lv.n-1];
    let playable = lv.n <= Save.data.unlocked && Save.data.stars >= need;
    if(isForest) playable = playable && forestUnlocked;
    const best = Save.data.best[lv.n] || 0;
    const div = document.createElement('div');
    div.className = 'lv-card' + (isForest ? ' forest-card' : '');
    if(!playable){
      div.classList.add('locked');
      div.innerHTML = `<svg class="lock" viewBox="0 0 24 24" width="26" height="26" fill="#A98BA8"><path d="M7 10V7a5 5 0 0 1 10 0v3h1a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2zm2 0h6V7a3 3 0 0 0-6 0z"/></svg><div class="need">${need} 星</div>`;
    } else {
      if(best>0) div.classList.add('cleared');
      if(best===0 && lv.n===Save.data.unlocked) div.classList.add('current');
      div.innerHTML = `<div class="num">${lv.n}</div><div class="stars">${'★'.repeat(best)}${'☆'.repeat(3-best)}</div><div class="lbl">${lvLabel(lv)}</div>`;
      div.addEventListener('click', ()=>{ Sfx.ensure(); Sfx.click(); startLevel(lv.n); });
    }
    parent.appendChild(div);
  });
}

/* ---------------- 游戏 ---------------- */
function renderHUD(){
  const lv = Engine.level;
  const stepsLeft = Math.max(0, lv.steps - Engine.moves);
  $('hud-target').textContent = lv.collect
    ? (lv.type==='both' ? lv.target + ' 分 · ' + lv.collect.n + ' 个' : lv.collect.n + ' 个')
    : lv.target + ' 分';
  $('hud-steps').textContent = stepsLeft;
  $('hud-score').textContent = Engine.score;
  const cur = lv.collect
    ? (lv.type==='both' ? Math.max(Engine.score/lv.target, Engine.collected/lv.collect.n) : Engine.collected/lv.collect.n)
    : Math.min(1, Engine.score/lv.target);
  $('goal-fill').style.width = Math.min(100, cur*100) + '%';
  $('goal-cur').textContent = lv.collect
    ? (lv.type==='both' ? Engine.score+' / '+lv.target+' · '+Engine.collected+'/'+lv.collect.n : Engine.collected+' / '+lv.collect.n)
    : Engine.score+' / '+lv.target;
}

function renderBoard(anim){
  anim = anim || {};
  const board = $('board'); board.innerHTML = '';
  for(let r=0;r<CONFIG.rows;r++) for(let c=0;c<CONFIG.cols;c++){
    const b = Engine.board[r][c];
    const cell = document.createElement('div');
    cell.className = 'cell';
    if(b.s==='h' || b.s==='v') cell.classList.add('special-stripe');
    if(b.s==='rainbow') cell.classList.add('special-rainbow');
    if(anim.popping && anim.popping.has(r+','+c)) cell.classList.add('popping');
    if(anim.falling && anim.falling.has(r+','+c)) cell.classList.add('falling');
    const img = document.createElement('img');
    img.src = ASSETS[b.t]; img.alt = b.t; img.draggable = false;
    cell.appendChild(img);
    cell.dataset.r = r; cell.dataset.c = c;
    if(selected && selected.r===r && selected.c===c) cell.classList.add('selected');
    if(hintPair && hintPair.some(p=>p.r===r && p.c===c)) cell.classList.add('hint');
    board.appendChild(cell);
  }
}

function showCombo(combo, pts){
  const el = $('combo-float');
  el.textContent = combo > 1 ? 'Combo ×' + combo + ' ！' : '+' + pts;
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
}
/* 找一对可交换消除的相邻糖果（教学引导用，无副作用） */
function findHintPair(){
  for(let r=0;r<CONFIG.rows;r++) for(let c=0;c<CONFIG.cols;c++){
    if(c+1<CONFIG.cols && Engine.wouldMatch({r,c},{r,c:c+1})) return [{r,c},{r,c:c+1}];
    if(r+1<CONFIG.rows && Engine.wouldMatch({r,c},{r:r+1,c})) return [{r,c},{r:r+1,c}];
  }
  return null;
}
let toastTimer = null;
function showToast(msg){
  const t = $('toast'); t.textContent = msg;
  t.classList.add('show'); clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 1700);
}

$('board').addEventListener('click', e=>{
  const cell = e.target.closest('.cell');
  if(!cell || Engine.busy || Engine.over) return;
  Sfx.ensure(); Sfx.click();
  const r = +cell.dataset.r, c = +cell.dataset.c;
  if(!selected){ selected = {r,c}; renderBoard(); return; }
  if(selected.r===r && selected.c===c){ selected = null; renderBoard(); return; }
  if(Math.abs(r-selected.r)+Math.abs(c-selected.c)===1){
    const a = selected; selected = null;
    doSwap(a, {r,c});
  } else {
    selected = {r,c}; renderBoard();
  }
});

async function doSwap(a,b){
  Engine.busy = true;
  const ok = Engine.swap(a,b);
  renderBoard();
  if(!ok){
    Sfx.swapback();
    if(Engine.noMatchHints < 3){
      Engine.noMatchHints++;
      const same = Engine.board[a.r][a.c].t === Engine.board[b.r][b.c].t;
      showToast(same ? '两颗相同糖果交换不会消除，试试换两颗不同的～' : '这样交换没凑成 3 连，再观察一下～');
    }
    Engine.busy = false; return;
  }
  hintPair = null;
  Sfx.swap();
  Engine.moves++;
  await sleep(CONFIG.animMs.swap);
  await resolveLoop();
  if(!Engine.hasValidMove()){ Engine.shuffle(); renderBoard(); showToast('没有可消除的啦，重新洗牌！'); }
  renderHUD();
  updateWinNow();
  if(Engine.moves >= Engine.level.steps && !Engine.over){ Engine.over = true; endLevel(checkWin()); }
  Engine.busy = false;
}

async function resolveLoop(){
  let guard = 0;
  while(guard++ < CONFIG.shuffleGuard){
    const round = Engine.settleRound();
    if(!round) break;
    if(round.specials.length) Sfx.special(); else Sfx.clear(round.combo);
    showCombo(round.combo, round.pts);
    renderBoard({ popping: round.eliminate });
    await sleep(CONFIG.animMs.pop);
    const filled = Engine.applyGravity(round.eliminate);
    renderBoard({ falling: filled });
    await sleep(CONFIG.animMs.fall);
    renderHUD();
  }
  Engine.combo = 0;
}

/* ---------------- 结算 ---------------- */
function checkWin(){
  const lv = Engine.level;
  if(lv.type === 'collect') return Engine.collected >= lv.collect.n;
  if(lv.type === 'both') return Engine.score >= lv.target && Engine.collected >= lv.collect.n;
  return Engine.score >= lv.target;
}
/* 达标后显示「过关」按钮，允许提前结算拿剩余步数奖励 */
function updateWinNow(){
  const btn = $('btn-win-now');
  if(!btn || Engine.over || currentView !== 'game') return;
  if(checkWin()){
    btn.style.display = '';
    if(!btn.dataset.tip){
      btn.dataset.tip = '1';
      showToast('目标达成！点「过关」领奖励，或继续冲更高分');
    }
  }
}
function calcStars(score){
  const lv = Engine.level;
  if(score >= lv.star3) return 3;
  if(score >= lv.star2) return 2;
  return 1;
}
function endLevel(win){
  Engine.over = true;
  const lv = Engine.level;
  if(!win){ showResult(false, 0, 0); return; }
  const stars = calcStars(Engine.score);
  const winCoins = CONFIG.coinsBase + stars * CONFIG.coinsPerStar;
  const stepCoins = Math.max(0, lv.steps - Engine.moves) * CONFIG.coinsPerStep;
  const total = winCoins + stepCoins;
  const d = Save.data;
  d.coins += total; d.stars += stars; d.wins++;
  d.best[lv.n] = Math.max(d.best[lv.n] || 0, stars);
  if(lv.n >= d.unlocked && lv.n < LEVELS.length) d.unlocked = lv.n + 1;
  for(const k in CONFIG.dexUnlock){
    if(CONFIG.dexUnlock[k] === lv.n && !d.dex[k]){ d.dex[k] = true; }
  }
  if(!d.dexDone && Object.keys(CONFIG.dexUnlock).every(k => d.dex[k])){
    d.dexDone = true; d.stars += CONFIG.dexReward;
  }
  Save.save();
  showResult(true, stars, total, stepCoins);
}
function showResult(win, stars, coins, stepCoins){
  const mask = $('result-mask');
  $('result-title').textContent = win ? '过关啦！' : '差一点点…';
  $('result-sub').textContent = win ? '花园又前进一步' : '再试一次，星星就在眼前';
  $('reward-win').textContent = '金币 +' + coins;
  $('reward-step').textContent = win ? ('金币 +' + stepCoins) : '—';
  const starsEls = document.querySelectorAll('#star-row .star');
  starsEls.forEach(s=>{ s.classList.remove('on'); s.style.animationDelay = '0s'; });
  if(win){
    starsEls.forEach((s,i)=>{
      s.style.animationDelay = (0.25 + i*0.28) + 's';
      setTimeout(()=>{ if(i < stars){ s.classList.add('on'); Sfx.star(); } }, 260 + i*280);
    });
    $('btn-result-next').style.display = (Engine.level.n < LEVELS.length) ? '' : 'none';
    $('btn-result-back').textContent = '返回地图';
  } else {
    $('btn-result-next').style.display = 'none';
    $('btn-result-back').textContent = '返回地图';
  }
  mask.classList.add('show');
}
$('btn-result-back').addEventListener('click', ()=>{ $('result-mask').classList.remove('show'); go('map'); });
$('btn-result-next').addEventListener('click', ()=>{ $('result-mask').classList.remove('show'); startLevel(Engine.level.n + 1); });

/* ---------------- 花园 ---------------- */
function plotStatus(i){
  const p = Save.data.garden[i];
  if(!p.seed) return 'empty';
  const done = Date.now() - p.plantedAt >= CONFIG.seeds[p.seed].growMs;
  return done ? 'ready' : 'growing';
}
function renderFlowerDex(){
  const el = $('flower-dex'); if(!el) return;
  if(Save.data.flowerDexDone){
    el.textContent = '花朵图鉴 ★ 集齐！星星奖励已到账';
    el.style.background = 'linear-gradient(90deg,#FFE9A8,#FFD6E8)';
    return;
  }
  const keys = Object.keys(CONFIG.seeds);
  const lit = keys.filter(k => (Save.data.flowerDex[k]||0) >= CONFIG.flowerDexNeed).length;
  el.textContent = '花朵图鉴 ' + lit + '/' + keys.length + ' · 每种收获 ' + CONFIG.flowerDexNeed + ' 次点亮 · 集齐 +' + CONFIG.flowerDexReward + ' 星';
}
function renderGarden(){
  $('garden-coins').textContent = Save.data.coins;
  renderFlowerDex();
  const pc = $('pet-corner');

      div.classList.add('locked');
      div.innerHTML = `<svg class="lock" viewBox="0 0 24 24" width="26" height="26" fill="#A98BA8"><path d="M7 10V7a5 5 0 0 1 10 0v3h1a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2zm2 0h6V7a3 3 0 0 0-6 0z"/></svg><div class="p-name">地块 ${i+1}</div><div class="p-hint">${plot.price} 币解锁</div>`;

          st.owned = true; Save.data.coins -= plot.price; Save.save(); Sfx.coin(); renderGarden();

      });
    } else {
      const status = plotStatus(i);

        div.innerHTML = `<div class="p-hint" style="font-size:22px;">＋</div><div class="p-name">空地块</div><div class="p-hint">点击种花</div>`;
        div.addEventListener('click', ()=>{ Sfx.ensure(); Sfx.click(); openShop(i); });
      } else if(status === 'growing'){
        const cfg = CONFIG.seeds[st.seed];
        const pct = Math.min(100, (Date.now()-st.plantedAt)/cfg.growMs*100);
        div.classList.add('growing');
        div.innerHTML = `<img src="${cfg.img}"><div class="p-name">${cfg.name}</div><div class="grow-bar"><div class="f" style="width:${pct}%"></div></div>`;
        div.addEventListener('click', ()=>{ showToast('还在生长中，等一会儿～'); });
      } else {
        const cfg = CONFIG.seeds[st.seed];
        div.classList.add('ready');
        div.innerHTML = `<img src="${cfg.img}"><div class="p-name">${cfg.name}</div><div class="p-hint">点我收获！</div>`;
        div.addEventListener('click', ()=>{
          Sfx.ensure(); Sfx.harvest();
          const seedK = st.seed;
          Save.data.coins += cfg.reward; st.seed = null; st.plantedAt = 0;
          Save.data.flowerDex[seedK] = (Save.data.flowerDex[seedK] || 0) + 1;
          let msg = '收获 ' + cfg.reward + ' 币！';
          if(!Save.data.flowerDexDone){
            const keys = Object.keys(CONFIG.seeds);
            const lit = keys.filter(k => (Save.data.flowerDex[k]||0) >= CONFIG.flowerDexNeed).length;
            if(lit >= keys.length){
              Save.data.flowerDexDone = true;
              Save.data.stars += CONFIG.flowerDexReward;
              msg = '花朵图鉴集齐！星星 +' + CONFIG.flowerDexReward + ' ★';
            } else if((Save.data.flowerDex[seedK]||0) === CONFIG.flowerDexNeed){
              msg += ' 点亮「' + cfg.name + '」图鉴！';
            }
          }
          Save.save(); renderGarden();
          showToast(msg);
        });
      }
    }
    grid.appendChild(div);
  });
}
function openShop(i){
  currentPlot = i;
  const list = $('seed-list'); list.innerHTML = '';
  for(const k in CONFIG.seeds){
    const s = CONFIG.seeds[k];
    const item = document.createElement('div'); item.className = 'seed-item';
    const afford = Save.data.coins >= s.price;
    item.innerHTML = `<img src="${s.img}">
      <div><div class="s-name">${s.name}</div><div class="s-desc">${s.price} 币 · ${Math.round(s.growMs/1000)} 秒成熟 · 收 ${s.reward} 币</div></div>
      <button class="btn mini ${afford?'':'ghost'}" ${afford?'':'disabled'}>种植</button>`;
    item.querySelector('button').addEventListener('click', ()=>{
      if(Save.data.coins < s.price) return;
      Save.data.coins -= s.price;
      Save.data.garden[currentPlot] = { seed:k, plantedAt: Date.now(), owned:true };
      Save.save(); Sfx.coin(); closeShop(); renderGarden();
    });
    list.appendChild(item);
  }
  $('seed-shop').classList.add('open');
  $('garden-overlay').classList.add('show');
}
function closeShop(){
  $('seed-shop').classList.remove('open');
  $('garden-overlay').classList.remove('show');
}
$('garden-overlay').addEventListener('click', closeShop);
function startGardenTimer(){
  if(gardenTimer) clearInterval(gardenTimer);
  gardenTimer = setInterval(()=>{
    if(currentView !== 'garden') return;
    let anyReady = false;
    Save.data.garden.forEach((p,i)=>{
      if(p.seed && plotStatus(i)==='ready'){
        const plot = document.querySelector(`.plot[data-i="${i}"]`);
        if(plot && !plot.classList.contains('ready')){ plot.classList.add('ready'); anyReady = true; }
      }
    });
    if(anyReady) renderGarden();
  }, 1000);
}

function renderDex(){
  const got = Object.keys(Save.data.dex).length;
  $('dex-count').textContent = got + '/' + DEX.length;
  $('dex-fill').style.width = (got/DEX.length*100) + '%';
  const tip = $('dex-tip');
  if(tip){
    tip.textContent = Save.data.dexDone
      ? '动物图鉴 ★ 集齐！星星奖励已到账'
      : '集齐 ' + DEX.length + ' 只小动物，奖励 ' + CONFIG.dexReward + ' 星';
    if(Save.data.dexDone) tip.style.background = 'linear-gradient(90deg,#FFE9A8,#FFD6E8)';
  }
  const grid = $('dex-grid'); grid.innerHTML = '';
  DEX.forEach(d=>{
    const div = document.createElement('div');
    div.className = 'dex-card' + (Save.data.dex[d.k] ? '' : ' locked');
    div.innerHTML = `<img src="${d.img}"><div class="d-name">${d.name}</div><div class="d-how">${Save.data.dex[d.k] ? '已收集' : d.how}</div>`;
    grid.appendChild(div);
  });
}

/* ---------------- 启动与按钮 ---------------- */
function startLevel(n){
  const lv = LEVELS[n-1];
  Engine.init(lv);
  selected = null; hintPair = null;
  const winBtn = $('btn-win-now');
  if(winBtn){ winBtn.style.display = 'none'; winBtn.dataset.tip = ''; }
  $('hud-level').textContent = n;
  $('view-game').classList.toggle('forest', n >= 21);
  renderHUD(); renderBoard();
  go('game');
  if(!Save.data.tutorialDone) $('tutorial').classList.add('show');
}
$('btn-play').addEventListener('click', ()=>{ Sfx.ensure(); Sfx.click(); go('map'); });
$('btn-garden').addEventListener('click', ()=>{ Sfx.ensure(); Sfx.click(); go('garden'); });
$('btn-dex').addEventListener('click', ()=>{ Sfx.ensure(); Sfx.click(); go('dex'); });
$('btn-tut-ok').addEventListener('click', ()=>{
  $('tutorial').classList.remove('show');
  Save.data.tutorialDone = true; Save.save();
  hintPair = findHintPair();
  if(hintPair){ renderBoard(); showToast('试试交换高亮的两颗糖果，凑 3 连就能消除！'); }
});
$('btn-shuffle').addEventListener('click', ()=>{
  if(Engine.busy || Engine.over || currentView!=='game') return;
  Engine.shuffle(); renderBoard(); showToast('重新洗牌！');
});
$('btn-restart').addEventListener('click', ()=>{
  if(currentView!=='game') return;
  startLevel(Engine.level ? Engine.level.n : 1);
});
$('btn-win-now').addEventListener('click', ()=>{
  if(Engine.busy || Engine.over || currentView!=='game') return;
  Engine.over = true;
  endLevel(true);
});
$('btn-mute').addEventListener('click', ()=>{
  Save.data.muted = !Save.data.muted; Sfx.muted = Save.data.muted; Save.save();
  $('btn-mute').textContent = Save.data.muted ? '声音：关' : '声音：开';
  if(Save.data.muted) Music.stop(); else Music.tryStart();
});

/* ---------------- 调试面板 ---------------- */
$('dbg-rid').textContent = RULESET_ID;
$('dbg-toggle').addEventListener('click', e=>{ e.stopPropagation(); $('debug').classList.toggle('open'); });
$('dbg-coin').addEventListener('click', ()=>{ Save.data.coins += 100; Save.save(); refreshHome(); renderGarden(); });
$('dbg-skip').addEventListener('click', ()=>{
  if(!Engine.level || Engine.over) return;
  Engine.score = Engine.level.target;
  Engine.moves = Engine.level.steps;
  endLevel(true);
});
$('dbg-shuffle').addEventListener('click', ()=>{
  if(!Engine.board) return;
  Engine.shuffle(); renderBoard();
});
$('dbg-reset').addEventListener('click', ()=>{
  if(confirm('确定重置全部存档吗？')){ Save.reset(); location.reload(); }
});
$('dbg-test').addEventListener('click', ()=>{
  const r = selftest();
  alert(r.pass + ' 项通过 / ' + r.fail + ' 项失败（详见控制台）');
});

/* ---------------- 自测（核心逻辑断言） ---------------- */
function selftest(){
  const r = { pass:0, fail:0 };
  const check = (name, cond)=>{
    if(cond){ r.pass++; console.log('PASS · ' + name); }
    else { r.fail++; console.error('FAIL · ' + name); }
  };
  const mk = rows => rows.map(row => row.map(t => ({ t, s:null })));
  // 1 关卡生成与星级阈值
  const ls = genLevels();
  check('生成 25 关', ls.length === 25);
  check('目标分数递增', ls.every((l,i)=> i===0 || l.target > ls[i-1].target));
  check('第1关目标/星级 = 600/960/1500', ls[0].target===600 && ls[0].star2===960 && ls[0].star3===1500);
  check('第25关目标 = 3800', ls[24].target === 3800);
  // 2 匹配检测
  Engine.board = mk([
    ['a','a','a','b','b','b','c','c'],
    ['d','e','f','g','h','i','j','k'],
    ['a','d','a','d','a','d','a','d'],
    ['b','b','b','c','c','c','d','d'],
    ['e','e','e','e','f','f','g','g'],
    ['h','i','j','k','l','m','n','o'],
    ['p','q','r','s','t','u','v','w'],
    ['x','y','z','x','y','z','x','y']
  ]);
  const m0 = Engine.findMatches();
  check('行扫描检出 3 连', m0.some(m=>m.dir==='h' && m.len===3));
  check('行扫描检出 4 连(第5行 eeee)', m0.some(m=>m.t==='e' && m.len===4));
  // 3 交换有效性（使用无预置匹配的棋盘）
  Engine.board = mk([
    ['a','b','c','d','e','f','g','h'],
    ['i','j','k','l','m','n','o','p'],
    ['q','r','s','t','u','v','w','x'],
    ['y','z','a','b','c','d','e','f'],
    ['g','h','i','j','k','l','m','n'],
    ['o','p','q','r','s','t','u','v'],
    ['w','x','y','z','a','b','c','d'],
    ['e','f','g','h','i','j','k','l']
  ]);
  check('无效交换回滚', Engine.swap({r:1,c:0},{r:1,c:1}) === false && Engine.board[1][0].t==='i');
  // 4 特殊糖生成（4连 → 条纹）
  Engine.board = mk([
    ['a','b','c','d','e','f','g','h'],
    ['i','j','k','l','m','n','o','p'],
    ['q','r','s','t','u','v','w','x'],
    ['y','z','a','b','c','d','e','f'],
    ['g','h','i','j','k','l','m','n'],
    ['o','p','q','r','s','t','u','v'],
    ['w','x','y','z','a','b','c','d'],
    ['e','f','g','h','i','j','k','l']
  ]);
  Engine.board[0][0].t='s'; Engine.board[0][1].t='s'; Engine.board[0][2].t='s'; Engine.board[0][3].t='s';
  Engine.level = { collect:null };
  Engine.score = 0; Engine.combo = 0;
  const round = Engine.settleRound();
  check('4 连生成条纹特殊糖', round && round.specials.some(s=>s.s==='h' || s.s==='v'));
  check('4 连消除 3 块并生成 1 个条纹', round && round.eliminate.size === 3 && round.specials.length === 1);
  // 5 重力填充
  const filled = Engine.applyGravity(round.eliminate);
  check('重力填充无空位', Engine.board.every(row=>row.every(cell=>cell && cell.t)));
  check('填充格子数 = 消除数', filled.size === round.eliminate.size);
  // 6 洗牌后有可用移动
  Engine.shuffle();
  check('洗牌后存在有效移动', Engine.hasValidMove());
  console.log('自测完成：' + r.pass + ' 通过 / ' + r.fail + ' 失败');
  return r;
}

/* ---------------- 初始化 ---------------- */
let currentView = 'home';
function init(){
  Save.load();
  Sfx.muted = Save.data.muted;
  $('btn-mute').textContent = Save.data.muted ? '声音：关' : '声音：开';
  startGardenTimer();
  go('home');
}
window.addEventListener('load', init);
</script>
